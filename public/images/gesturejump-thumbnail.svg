<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250" viewBox="0 0 400 250" fill="none">
  <rect width="400" height="250" rx="16" fill="#0a0814"/>
  <g stroke="rgba(0,246,255,0.08)" stroke-width="1">
