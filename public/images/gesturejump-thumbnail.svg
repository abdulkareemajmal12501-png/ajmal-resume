  <text x="200" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#e9f7ff" text-anchor="middle" letter-spacing="0.05em">GestureJump</text>
  <text x="200" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8de6ff" text-anchor="middle" opacity="0.7">Hand Gesture Controlled Game</text>
  <defs>
